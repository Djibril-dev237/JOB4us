name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: job4us
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/job4us
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-auth-secret-not-real-0123456789abcdef
      ADMIN_2FA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYg==
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_BUCKET: job4us
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      RESEND_API_KEY: ""
      EMAIL_FROM: "Job4Us <notifications@example.com>"
      CRON_SECRET: ci-cron-secret-not-real

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
